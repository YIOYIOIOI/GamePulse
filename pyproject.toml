[project]
name = "gamepulse"
version = "0.2.0"
description = "Player feedback monitoring for game teams: Steam reviews, GitHub issues, releases and follow-ups"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<1",
  "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
